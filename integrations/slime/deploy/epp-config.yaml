# Burst prefix-cache EPP config for slime (prefix-dominant profile).
# Pipeline: burst-prefix-cache-producer -> prefix-cache-scorer.
# Profile is prefix-cache-scorer (2) + load-aware-scorer (1) with max-score-picker.
# Extended with file-discovery and sglanghttp-parser (input_ids from /generate).

apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-discovery
    type: file-discovery
    parameters:
      path: /tmp/epp-endpoints.yaml
      watchFile: true

  - name: prefix-cache-scorer
    type: prefix-cache-scorer
    parameters:
      prefixMatchInfoProducerName: burst-prefix-cache-producer

  - name: burst-prefix-cache-producer
    type: burst-prefix-cache-producer
    parameters:
      windowDurationMs: 1000
      maxPerReplica: -1
      blockSizeTokens: 64
      minColocateBlocks: 1
      maxBatchSize: 10000
      balanceBy: tokens

  - name: load-aware-scorer
    type: load-aware-scorer

  - name: max-score-picker
    type: max-score-picker

  - name: metrics-source
    type: metrics-data-source

  - name: metrics-extractor
    type: core-metrics-extractor

  - name: sglanghttp-parser
    type: sglanghttp-parser

requestHandler:
  parsers:
    - pluginRef: sglanghttp-parser

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: load-aware-scorer
        weight: 1
      - pluginRef: max-score-picker

dataLayer:
  discovery:
    pluginRef: file-discovery
  sources:
    - pluginRef: metrics-source
      extractors:
        - pluginRef: metrics-extractor
