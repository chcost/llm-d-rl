[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-d-rl-verl-integration"
version = "0.1.0"
description = "llm-d EPP router and Envoy integrations for verl"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ray",
    "omegaconf",
    "grpcio",
    "aiohttp",
    "pyyaml",
    "llm-d-rl-common @ git+https://github.com/llm-d-incubation/llm-d-rl.git#subdirectory=integrations/common",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_d_rl_verl_integration*"]

[project.scripts]
# Print the hydra overrides that turn the integration on for a given mode.
llm-d-rl-verl-overrides = "llm_d_rl_verl_integration.modes:main"

[tool.setuptools.package-data]
# modes.yaml is the override contract; it must ship with the package.
"llm_d_rl_verl_integration" = ["modes.yaml"]
