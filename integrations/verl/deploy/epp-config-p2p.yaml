# Burst prefix-cache EPP config for verl, extended with P2P KV-cache sharing
# (llm-d/llm-d PR #2067): p2p-source-producer stamps the best-cached peer onto
# each request as x-kv-cache-source-host-port; the sidecar launched by
# P2PVLLMHttpServer (p2p_replica.py) reads that header and injects
# kv_transfer_params.remote_kv_source so vLLM's OffloadingConnector pulls the
# cached prefix from the peer's CPU tier instead of recomputing it. Requires
# --mode epp-p2p (rollout.name=vllm-llmd-p2p), which gives every replica's
# reported address as its local sidecar's port, not vLLM's - see p2p_replica.py.
#
# Everything else is identical to common/configs/epp-config-burst.yaml: same burst producer, same
# prefix-cache-scorer + load-aware-scorer profile. p2p-source-producer consumes
# burst-prefix-cache-producer's PrefixCacheMatchInfo via prefixMatchInfoProducerName,
# the same pattern prefix-cache-scorer already uses below.

apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-discovery
    type: file-discovery
    parameters:
      path: /tmp/epp-endpoints.yaml
      watchFile: true

  - name: prefix-cache-scorer
    type: prefix-cache-scorer
    parameters:
      prefixMatchInfoProducerName: burst-prefix-cache-producer

  - name: burst-prefix-cache-producer
    type: burst-prefix-cache-producer
    parameters:
      windowDurationMs: 1000
      maxPerReplica: -1
      blockSizeTokens: 64
      minColocateBlocks: 1
      maxBatchSize: 10000
      balanceBy: tokens

  - name: p2p-source-producer
    type: p2p-source-producer
    parameters:
      # Reuse the burst producer's PrefixCacheMatchInfo instead of the default
      # approximate/persistent producer, same as prefix-cache-scorer above.
      prefixMatchInfoProducerName: burst-prefix-cache-producer
      # Guide's measured RDMA crossover: only stamp a peer when it out-caches the
      # serving pod by at least this many tokens, so a marginal advantage doesn't
      # pay a pull's fixed cost for nothing.
      minCachedTokenDelta: 2048

  - name: load-aware-scorer
    type: load-aware-scorer

  - name: max-score-picker
    type: max-score-picker

  - name: metrics-source
    type: metrics-data-source

  - name: metrics-extractor
    type: core-metrics-extractor

  - name: vllmhttp-parser
    type: vllmhttp-parser

requestHandler:
  parsers:
    - pluginRef: vllmhttp-parser

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: load-aware-scorer
        weight: 1
      - pluginRef: max-score-picker
      # p2p-source-producer is NOT listed here, matching burst-prefix-cache-producer
      # above: data producers run as part of the framework's request pipeline (wired
      # by name via prefixMatchInfoProducerName references), not via schedulingProfiles
      # - that list is for filters/scorers/pickers only.

dataLayer:
  discovery:
    pluginRef: file-discovery
  sources:
    - pluginRef: metrics-source
      extractors:
        - pluginRef: metrics-extractor
