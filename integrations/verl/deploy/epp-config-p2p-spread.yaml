# GRPO group SPREAD + P2P pull (experiment arm).
#
# Hypothesis under test: in multi-turn GRPO the n=8 samples of a prompt share its
# KV, so the burst producer's default maxPerReplica=-1 puts all 8 on ONE replica -
# maximum reuse, but the group's whole load lands on one GPU, and if any sample
# runs long that GPU sets the makespan. Spreading the 8 across 8 replicas balances
# the load, and p2p-source-producer still stamps the peer that holds the shared
# prefix so each sibling PULLS it instead of recomputing. Balance AND reuse.
#
# maxPerReplica: 1 is the only change from epp-config-p2p.yaml.
#
# Caveat on the replay: all 8 duplicates replay byte-identical turns, so they share
# 100% of their KV. Real GRPO samples diverge after the first sampled response and
# share only the initial prompt, so this OVERSTATES the reuse available. It tests
# the mechanism, not the magnitude.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig

plugins:
  - name: file-discovery
    type: file-discovery
    parameters:
      path: /tmp/epp-endpoints.yaml
      watchFile: true

  - name: prefix-cache-scorer
    type: prefix-cache-scorer
    parameters:
      prefixMatchInfoProducerName: burst-prefix-cache-producer

  - name: burst-prefix-cache-producer
    type: burst-prefix-cache-producer
    parameters:
      windowDurationMs: 1000
      maxPerReplica: 1
      blockSizeTokens: 64
      minColocateBlocks: 1
      maxBatchSize: 10000
      balanceBy: tokens

  - name: p2p-source-producer
    type: p2p-source-producer
    parameters:
      # Reuse the burst producer's PrefixCacheMatchInfo instead of the default
      # approximate/persistent producer, same as prefix-cache-scorer above.
      prefixMatchInfoProducerName: burst-prefix-cache-producer
      # Guide's measured RDMA crossover: only stamp a peer when it out-caches the
      # serving pod by at least this many tokens, so a marginal advantage doesn't
      # pay a pull's fixed cost for nothing.
      minCachedTokenDelta: 2048

  - name: load-aware-scorer
    type: load-aware-scorer

  - name: max-score-picker
    type: max-score-picker

  - name: metrics-source
    type: metrics-data-source

  - name: metrics-extractor
    type: core-metrics-extractor

  - name: vllmhttp-parser
    type: vllmhttp-parser

requestHandler:
  parsers:
    - pluginRef: vllmhttp-parser

schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: prefix-cache-scorer
        weight: 2
      - pluginRef: load-aware-scorer
        weight: 1
      - pluginRef: max-score-picker
      # p2p-source-producer is NOT listed here, matching burst-prefix-cache-producer
      # above: data producers run as part of the framework's request pipeline (wired
      # by name via prefixMatchInfoProducerName references), not via schedulingProfiles
      # - that list is for filters/scorers/pickers only.

dataLayer:
  discovery:
    pluginRef: file-discovery
  sources:
    - pluginRef: metrics-source
      extractors:
        - pluginRef: metrics-extractor
