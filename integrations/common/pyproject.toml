[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-d-rl-common"
version = "0.1.0"
description = "Framework-agnostic EPP client and routing utilities shared across llm-d-rl integrations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio",
    "pyyaml",
]

[project.optional-dependencies]
# Only llm-d-registration-shim needs an HTTP server. A framework that starts EPP
# in-process (verl) never imports it, so it should not pull a web framework.
shim = [
    "fastapi",
    "uvicorn",
]
# Only llm_d_rl_common.ray_router imports ray. Frameworks that start the router
# from a pod lifecycle hook (llm-d-rl-router) never touch it.
ray = [
    "ray",
]

[project.scripts]
# Foreground EPP/Envoy launcher, for frameworks that start the router stack from
# a pod lifecycle hook rather than from inside the training process.
llm-d-rl-router = "llm_d_rl_common.cli:main"

llm-d-registration-shim = "llm_d_rl_common.registration_shim:main"

# Compose a shipped EPP config from base.yaml + a profile + modifiers.
llm-d-rl-epp-config = "llm_d_rl_common.epp_config:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_d_rl_common*"]

[tool.setuptools.package-data]
# The shipped routing configs are data inside the package, so pip install alone
# is enough to get them (see llm_d_rl_common/configs/__init__.py).
"llm_d_rl_common.configs" = ["*.yaml", "**/*.yaml", "**/*.env"]
