# Research and benchmark modes for the verl integration.
#
# These are NOT part of the integration: each one needs code from
# llm_d_rl_verl_bench - EPP logic prototyped in Python (epp_dev/), the sidecar's
# job done in-process (inproc_sidecar/), or the native control arm and its reqlog
# (native_logging/). The integration's own modes are in
# integrations/verl/src/llm_d_rl_verl_integration/modes.yaml.
#
# Same schema, same renderer:
#   llm-d-rl-verl-overrides --modes-file modes-bench.yaml --list
#
# run_test.sh reads this file and the integration's, so --mode still resolves
# either kind.

common:
  hydra:
    - trainer.use_v1=true
  # Appended after the per-mode overrides, matching the order the driver has
  # always emitted. No mode repeats a key, so order is not semantic - this just
  # keeps the generated argument list byte-identical to the previous one.
  hydra_last:
    - +actor_rollout_ref.rollout.custom.epp_endpoints_file=/tmp/epp-endpoints.yaml

epp_binary_env:
  - VERL_EPP_BINARY
  - VERL_ENVOY_BINARY
  - VERL_SIDECAR_BINARY

p2p_engine: &p2p_engine
  - +ray_kwargs.ray_init.runtime_env.env_vars.VERL_USE_EXTERNAL_MODULES=llm_d_rl_verl_bench.inproc_sidecar.register_p2p
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.block_size=64
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.kv_transfer_config.kv_connector=OffloadingConnector
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.kv_transfer_config.kv_role=kv_both
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.kv_transfer_config.kv_connector_extra_config.offload_prompt_only=false
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.kv_transfer_config.kv_connector_extra_config.cpu_bytes_to_use=${P2P_CPU_BYTES_TO_USE:-4294967296}
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.kv_transfer_config.kv_connector_extra_config.spec_name=TieringOffloadingSpec
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.kv_transfer_config.kv_connector_extra_config.secondary_tiers=[{type:p2p}]

modes:
  native:
    summary: stock verl routing, plus reqlog and the endpoints YAML for the scraper
    manager: llm_d_rl_verl_bench.native_logging.agent_loop_manager.NativeLoggingAgentLoopManager

  epp-p2p:
    summary: EPP routing plus P2P KV-cache sharing; a per-replica sidecar turns EPP's source header into kv_transfer_params
    manager: llm_d_rl_verl_integration.llmd_epp.agent_loop_manager.LlmdRouterAgentLoopManager
    epp_config: epp-config-p2p.yaml
    rollout_name: vllm-llmd-p2p
    external_lib: llm_d_rl_verl_bench.inproc_sidecar.register_p2p
    # The P2P tier deadlocks verl's engine sleep(), so pass
    # free_cache_engine=false to EVERY arm of a comparison, not just this one.
    hydra: *p2p_engine

  wave-admission:
    summary: estimation-gated admission with sticky placement, no EPP
    manager: llm_d_rl_verl_bench.epp_dev.wave_admission.agent_loop_manager.WaveAdmissionAgentLoopManager

  wave-admission-p2p:
    summary: wave-admission on the P2P backend, so a migration pulls the resident replica's KV
    manager: llm_d_rl_verl_bench.epp_dev.wave_admission.agent_loop_manager.WaveAdmissionAgentLoopManager
    rollout_name: vllm-llmd-p2p
    external_lib: llm_d_rl_verl_bench.inproc_sidecar.register_p2p
    hydra:
      - *p2p_engine
      - +actor_rollout_ref.rollout.custom.wave_admission_p2p_kv_available=true
      - +actor_rollout_ref.rollout.custom.wave_admission_reserve_mode=size
      - +actor_rollout_ref.rollout.custom.wave_admission_reserve_z=1.5
      - +actor_rollout_ref.rollout.custom.wave_admission_max_wait_s=${WAVE_ADMISSION_MAX_WAIT_S:-20}
    # Skip the sidecar and POST to vLLM's native endpoint. "enabled" not "true":
    # Ray's runtime_env.env_vars rejects the bool Hydra infers from "true".
    when:
      - env: WAVE_ADMISSION_P2P_NOSIDECAR
        equals: "true"
        hydra:
          - +ray_kwargs.ray_init.runtime_env.env_vars.VERL_P2P_NOSIDECAR=enabled
          - +actor_rollout_ref.rollout.custom.wave_admission_p2p_nosidecar=true
          - +actor_rollout_ref.rollout.custom.wave_admission_p2p_port=${WAVE_ADMISSION_P2P_PORT:-7777}
