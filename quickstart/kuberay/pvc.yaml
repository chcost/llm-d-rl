# Durable cache for HF checkpoints and built parquet datasets.
#
# Why: without it, every pod recreate costs a manual 15 GB
# Qwen2.5-7B-Instruct-1M re-download plus a weka train/test.parquet rebuild,
# which is what made manifest changes (dshm sizing, resource limits) expensive
# enough to avoid. With it, a recreate costs a pip install.
#
# Mounted by ray-cluster.yaml.tmpl at the paths that already exist -
# /tmp/verl/models, /tmp/verl/data, /tmp/verl/hf_cache - via subPath, so no
# workload, task.env or script needs to change. RWX because the head and the
# worker mount it at the same time.
#
# Not deleted by `deploy.sh delete` on purpose: the point is to outlive the
# cluster. `kubectl delete pvc verl-cache -n $NAMESPACE` to reclaim it (the
# shared-vast StorageClass is Retain, so the volume itself survives that too).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${PVC_NAME}
  namespace: ${NAMESPACE}
spec:
  accessModes:
  - ReadWriteMany
  # shared-vast is the cluster default (csi.vastdata.com, RWX, expansion
  # allowed). 1Ti holds Qwen3-4B (~8G) + Qwen2.5-7B-Instruct-1M (~15G) + the
  # parquet datasets + the HF cache with room to spare; expand rather than
  # recreate if it fills.
  storageClassName: shared-vast
  resources:
    requests:
      storage: 1Ti
